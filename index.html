<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>michibiki｜恋愛タイプ診断</title>
<style>
:root{--pink:#f6e8eb;--cream:#fffaf3;--ink:#514b4a;--blue:#eaf3f8;--line:#eadcda}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8f1ef,#edf5f8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.7}
main{max-width:850px;margin:auto;padding:22px 15px 60px}.hero,.panel,.result{background:#fffdfb;border:1px solid var(--line);border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 5px 20px #78615b0d}
.hero{text-align:center;background:linear-gradient(135deg,#fff8f5,#eff7fa)}h1{font-size:28px;letter-spacing:.08em;margin:5px}h2{font-size:19px;margin:0 0 14px}p{margin:6px 0}.sub{color:#8a8583;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;font-size:14px;font-weight:600}input,select,textarea{width:100%;margin-top:5px;padding:12px;border:1px solid #dfd4d1;border-radius:10px;background:white;color:var(--ink);font-size:16px}textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:999px;padding:13px 22px;font-size:16px;background:#91b2c5;color:white;font-weight:700;cursor:pointer}button.secondary{background:#d9b9bf;color:#514b4a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.result{display:none}.result h3{font-size:17px;color:#9a7078;margin:18px 0 4px}.pill{display:inline-block;background:var(--pink);padding:4px 10px;border-radius:99px;font-size:13px;margin:3px}
.admin{background:#fff8f7}.note{font-size:12px;color:#8b7776}.result p{white-space:pre-wrap}
@media(max-width:560px){main{padding:12px 10px 40px}.hero,.panel,.result{padding:17px;border-radius:16px}.grid{grid-template-columns:1fr}h1{font-size:24px}.actions button{width:100%}}
@media print{body{background:white}.no-print,.admin{display:none!important}.result{display:block!important;box-shadow:none;border:0}.hero{box-shadow:none}}
</style></head><body><main>
<section class="hero"><div class="sub">あなたの恋愛傾向を読み解く</div><h1>michibiki</h1><h2>恋愛タイプ診断</h2><p>自分らしい恋愛の形と、心が惹かれる相手を見つけましょう。</p></section>
<section class="panel no-print"><h2>① 基本情報</h2><div class="grid">
<label>お名前（任意）<input id="name" placeholder="お名前"></label>
<label>性別<select id="gender"><option value="">選択してください</option><option>女性</option><option>男性</option><option>回答しない</option></select></label>
<label>生年月日<input id="birth" type="date" required></label>
<label>出生時間<select id="timeMode"><option value="unknown">不明</option><option value="known">わかる</option></select></label>
<label id="timeWrap" style="display:none">出生時間<input id="time" type="time"></label>
<label>出生都道府県<select id="place"><option value="">選択してください</option><option>北海道</option><option>青森県</option><option>岩手県</option><option>宮城県</option><option>秋田県</option><option>山形県</option><option>福島県</option><option>茨城県</option><option>栃木県</option><option>群馬県</option><option>埼玉県</option><option>千葉県</option><option>東京都</option><option>神奈川県</option><option>新潟県</option><option>富山県</option><option>石川県</option><option>福井県</option><option>山梨県</option><option>長野県</option><option>岐阜県</option><option>静岡県</option><option>愛知県</option><option>三重県</option><option>滋賀県</option><option>京都府</option><option>大阪府</option><option>兵庫県</option><option>奈良県</option><option>和歌山県</option><option>鳥取県</option><option>島根県</option><option>岡山県</option><option>広島県</option><option>山口県</option><option>徳島県</option><option>香川県</option><option>愛媛県</option><option>高知県</option><option>福岡県</option><option>佐賀県</option><option>長崎県</option><option>熊本県</option><option>大分県</option><option>宮崎県</option><option>鹿児島県</option><option>沖縄県</option></select></label>
</div><p class="note">月星座は出生時間・出生地を使った正確な天文暦計算が必要です。この試作版では誤判定を避けるため、内部確認欄に入力した結果を使用します。</p></section>
<section class="panel no-print admin"><h2>② Nao専用・内部鑑定データ</h2><p class="note">ここに参考サイト等で確認した結果を入力します。お客様用鑑定書には占術名・内部メモは掲載されません。</p><div class="grid">
<label>算命学・十大主星<input id="star" placeholder="例：龍高星"></label>
<label>月星座<input id="moon" placeholder="例：蟹座"></label>
<label>宿曜<input id="shukuyo" placeholder="例：〇〇宿"></label>
<label>四柱推命・恋愛メモ<input id="four" placeholder="内部メモ"></label>
</div><label style="margin-top:12px">内部メモ<textarea id="memo" placeholder="鑑定時に気づいたことなど"></textarea></label>
<p class="note">参考：<a href="https://apollon-yamasaki.jp/marriage" target="_blank">算命学</a> ／ <a href="https://kosei-do.co.jp/fortune/uranai.php" target="_blank">宿曜</a> ／ <a href="https://moon-cycle.net/moon_sign.html" target="_blank">月星座・太陽星座</a></p>
</section>
<div class="actions no-print"><button id="go">鑑定結果を表示</button></div>
<section class="result" id="result"><div class="sub">michibiki｜恋愛鑑定書</div><h2 id="heading">恋愛タイプ鑑定</h2><div><span class="pill" id="numPill"></span><span class="pill" id="sunPill"></span></div>
<h3>恋愛での性格</h3><p id="love"></p><h3>好きなタイプ</h3><p id="type"></p><h3>求める行動</h3><p id="want"></p>
<div class="actions no-print"><button onclick="window.print()">PDFとして保存・印刷</button><button class="secondary" id="copy">鑑定文をコピー</button></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
$("timeMode").addEventListener("change",()=>{$("timeWrap").style.display=$("timeMode").value==="known"?"block":"none"});
function numerology(s){let n=s.replaceAll("-","").split("").reduce((a,b)=>a+Number(b),0);let original=n;while(n>9&&![11,22,33,44].includes(n)){n=String(n).split("").reduce((a,b)=>a+Number(b),0)}return {n,original};}
function sunSign(m,d){let x=m*100+d;return x>=321&&x<=419?"牡羊座":x>=420&&x<=520?"牡牛座":x>=521&&x<=621?"双子座":x>=622&&x<=722?"蟹座":x>=723&&x<=822?"獅子座":x>=823&&x<=922?"乙女座":x>=923&&x<=1023?"天秤座":x>=1024&&x<=1122?"蠍座":x>=1123&&x<=1221?"射手座":x>=1222||x<=119?"山羊座":x<=218?"水瓶座":"魚座";}
const nums={
1:["好きになると自分から動き、まっすぐに気持ちを伝える傾向。自分らしさを大切にしながら恋を育てます。","自立していて、自分の考えや目標を持つ人。お互いを尊重できる相手に惹かれます。","気持ちを曖昧にせず、言葉と行動で誠実に向き合ってくれることを求めます。"],
2:["相手の気持ちを細やかに感じ取り、安心できる関係を大切にする傾向。","優しく、気持ちを受け止めてくれる穏やかな人。","小さな気遣いやこまめな愛情表現で、安心させてくれることを求めます。"],
3:["一緒に楽しめることが恋の原動力。明るく自然体でいられる恋愛を好みます。","会話が弾み、好奇心があり、楽しい時間を共有できる人。","笑い合う時間や新しい体験を一緒に楽しむことを求めます。"],
4:["信頼を積み重ねる慎重派。軽い関係より、将来を見据えた恋を好みます。","誠実で約束を守り、生活感覚が合う安定した人。","言葉だけでなく、約束を守る行動や継続的な思いやりを求めます。"],
5:["自由さと刺激を大切にし、恋愛にも新鮮さや変化を求める傾向。","好奇心旺盛で柔軟。束縛せず、お互いの世界を尊重できる人。","干渉しすぎず、変化や挑戦を一緒に楽しんでくれることを求めます。"],
6:["好きな人を大切にし、愛情を注ぐことで関係を深める傾向。","思いやりがあり、愛情を素直に表現してくれる人。","感謝や愛情を言葉にし、二人の時間を丁寧に作ることを求めます。"],
7:["相手をよく観察し、心から信頼できるまでゆっくり距離を縮める傾向。","落ち着きがあり、考え方や価値観を深く共有できる人。","一人の時間も尊重しながら、誠実に対話してくれることを求めます。"],
8:["情熱的で、好きな人との関係を前向きに進めようとする傾向。","芯が強く、目標に向かって努力できる頼もしい人。","気持ちを行動で示し、対等な立場で支え合うことを求めます。"],
9:["相手の個性を受け止め、深い理解や精神的なつながりを大切にする傾向。","包容力があり、優しさと自分らしさを持つ人。","決めつけずに話を聞き、気持ちを理解しようとする姿勢を求めます。"],
11:["直感的に惹かれることがあり、心のつながりや特別な感覚を大切にする傾向。","感性が豊かで、繊細な気持ちを理解してくれる人。","表面的な言葉だけでなく、気持ちに寄り添う丁寧な愛情表現を求めます。"],
22:["恋愛にも理想と現実の両方を求め、将来を一緒に築ける相手を大切にする傾向。","志を持ち、信頼できる行動で未来を考えられる人。","口約束ではなく、二人の未来に向けて一緒に行動することを求めます。"],
33:["愛情深く、相手を包み込むような優しさを持つ傾向。与えることと受け取ることのバランスが鍵。","個性を認め合い、優しさを自然に返してくれる人。","一方通行にならず、互いに思いやりを返し合うことを求めます。"],
44:["責任感が強く、安心できる関係を着実に築こうとする傾向。","誠実で現実的な判断ができ、長期的な信頼を育める人。","言葉と行動に一貫性があり、日々の安心を積み重ねることを求めます。"]
};
$("go").addEventListener("click",()=>{let b=$("birth").value;if(!b){alert("生年月日を入力してください");return;}let [y,m,d]=b.split("-").map(Number),nu=numerology(b),sun=sunSign(m,d),v=nums[nu.n]||nums[9];$("heading").textContent=($("name").value||"あなた")+"の恋愛タイプ鑑定";$("numPill").textContent="運命数 "+nu.n;$("sunPill").textContent="太陽星座 "+sun;
$("love").textContent=v[0]+($("star").value? " 内部確認した星の傾向（"+$("star").value+"）も踏まえて、鑑定時に調整してください。":"");
$("type").textContent=v[1];$("want").textContent=v[2];$("result").style.display="block";$("result").scrollIntoView({behavior:"smooth",block:"start"});});
$("copy").addEventListener("click",async()=>{let t=["恋愛での性格",$("love").textContent,"好きなタイプ",$("type").textContent,"求める行動",$("want").textContent].join("\n\n");try{await navigator.clipboard.writeText(t);alert("鑑定文をコピーしました");}catch(e){alert("コピーできませんでした。PDF保存をご利用ください。");}});
</script></body></html>
