"牡羊座":"自分の気持ちに正直で、思い立ったら行動に移せる情熱家。新しいことを始める力があり、まっすぐな姿勢が魅力です。","牡牛座":"自分の感覚を大切にし、安心できるものをじっくり育てるタイプ。穏やかさと粘り強さがあり、好きなものへの愛情も深めです。","双子座":"好奇心が旺盛で、情報や人との会話から刺激を受けるタイプ。柔軟な発想と軽やかなコミュニケーションが魅力です。","蟹座":"身近な人を大切にし、共感力と面倒見のよさを持つタイプ。安心できる居場所や心のつながりを大事にします。","獅子座":"自分らしさを表現することが得意で、明るさと華やかさを持つタイプ。誇りと温かさがあり、周囲を元気づけます。","乙女座":"細やかな観察力があり、物事を整えたり役に立つことに喜びを感じるタイプ。誠実で、丁寧に取り組む姿勢が魅力です。","天秤座":"人との調和やバランス感覚を大切にするタイプ。相手の立場を考えながら、美しさや心地よさを見つけるのが得意です。","蠍座":"物事や人と深く向き合い、一度大切だと思ったものを簡単には手放さないタイプ。洞察力と集中力を持っています。","射手座":"自由を愛し、未知の世界や新しい経験に心が動くタイプ。前向きな探究心があり、自分の可能性を広げていきます。","山羊座":"目標に向けて着実に努力を重ねる現実派。責任感が強く、時間をかけて信頼や成果を築いていくタイプです。","水瓶座":"独自の視点や自由な発想を大切にするタイプ。周囲に流されず、自分らしい距離感で人と関わることができます。","魚座":"想像力と共感力が豊かで、人の気持ちを自然に感じ取るタイプ。優しさや柔らかな感性を持ち、心のつながりを大切にします。"};
function jdUTC(date){return date.getTime()/86400000+2440587.5}
function norm360(x){return ((x%360)+360)%360}
function sunLongitude(date){const T=(jdUTC(date)-2451545)/36525;const L0=norm360(280.46646+36000.76983*T+0.0003032*T*T);const M=norm360(357.52911+35999.05029*T-0.0001537*T*T);const Mr=M*Math.PI/180;const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(Mr)+(0.019993-0.000101*T)*Math.sin(2*Mr)+0.000289*Math.sin(3*Mr);return norm360(L0+C)}
function moonLongitude(date){const T=(jdUTC(date)-2451545)/36525;const rad=Math.PI/180;const L=norm360(218.3164477+481267.88123421*T-0.0015786*T*T+T*T*T/538841-T*T*T*T/65194000);const D=norm360(297.8501921+445267.1114034*T-0.0018819*T*T+T*T*T/545868-T*T*T*T/113065000);const M=norm360(357.5291092+35999.0502909*T-0.0001536*T*T+T*T*T/24490000);const Mp=norm360(134.9633964+477198.8675055*T+0.0087414*T*T+T*T*T/69699-T*T*T*T/14712000);const F=norm360(93.2720950+483202.0175233*T-0.0036539*T*T-T*T*T/3526000+T*T*T*T/863310000);const terms=[[0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],[0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],[2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],[0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],[4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],[2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],[2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],[2,0,-1,2,-2602],[2,-1,-2,0,2390]];let sum=0;for(const [d,m,mp,f,c] of terms){const e=Math.pow(1-0.002516*T-0.0000074*T*T,Math.abs(m));sum+=c*e*Math.sin((d*D+m*M+mp*Mp+f*F)*rad)}return norm360(L+sum/1000000)}
function signsForDay(ymd,fn){const [y,m,d]=ymd.split('-').map(Number);const out=[];for(let h=0;h<24;h+=3){const t=new Date(Date.UTC(y,m-1,d,h-9));const sign=zodiac[Math.floor(fn(t)/30)%12];if(!out.includes(sign))out.push(sign)}return out}
const nums={1:"行動力があり、エネルギッシュでリーダー気質（せっかちな一面も）",2:"共感力が高く、人をサポートする平和主義者",3:"好奇心旺盛で明るく、まわりを元気にするムードメーカー",4:"努力家で計画性があり、安定と秩序を重んじるロジカリスト",5:"自由を愛し、冒険心と変化を好むアクティブな人",6:"面倒見がよく、調和と愛情を大切にする家庭的な人",7:"知的好奇心が高く、論理的でマイペースな完璧主義者",8:"野心家で実行力があり、大きな目標を成し遂げるリーダー",9:"精神性が高く、誰に対しても優しく包み込む理想主義者",11:"直感力が非常に鋭く、独特の感性を持つメッセンジャー",22:"圧倒的なスケールで理想を形にするカリスマ性を持つ",33:"枠に囚われない宇宙的な価値観を持つアーティスト・変わり者"};
function numerology(s){let n=s.replaceAll("-","").split("").reduce((a,b)=>a+Number(b),0);while(n>9&&![11,22,33].includes(n))n=String(n).split("").reduce((a,b)=>a+Number(b),0);return n}
function sunSign(s){let [,m,d]=s.split("-").map(Number),x=m*100+d;return x>=321&&x<=419?"牡羊座":x>=420&&x<=520?"牡牛座":x>=521&&x<=621?"双子座":x>=622&&x<=722?"蟹座":x>=723&&x<=822?"獅子座":x>=823&&x<=922?"乙女座":x>=923&&x<=1023?"天秤座":x>=1024&&x<=1122?"蠍座":x>=1123&&x<=1221?"射手座":(x>=1222||x<=119)?"山羊座":x<=218?"水瓶座":"魚座"}
function dayPillar(s){let [y,m,d]=s.split("-").map(Number),a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3,j=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045,idx=(j+49)%60;return{stem:stems[idx%10],branch:branches[idx%12]}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function make(){let s=document.getElementById("birth").value;if(!s){alert("生年月日を入力してください");return}let name=document.getElementById("name").value.trim()||"お客様",num=numerology(s),sunList=signsForDay(s,sunLongitude),moonList=signsForDay(s,moonLongitude),sun=sunList[0],moon=moonList[0],p=dayPillar(s),dt=new Date(s+"T12:00:00"),date=`${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日`,place=document.getElementById("place").value;

document.getElementById("sunText").innerHTML=sunList.map(z=>`<div class="astrology-card"><h4>${z}</h4><p>${zodiacReadings[z]}</p>${sunList.length>1?'<p class="hint">この日は星座が切り替わる可能性があるため、出生時刻によって結果が異なります。</p>':''}</div>`).join("");
document.getElementById("moonText").innerHTML=moonList.map(z=>`<div class="astrology-card"><h4>${z}</h4><p>${zodiacReadings[z]}</p>${moonList.length>1?'<p class="hint">この日は月星座が切り替わる可能性があります。出生時刻が不明なため、候補を併記しています。</p>':''}</div>`).join("");
document.getElementById("comboText").innerHTML=`<div class="astrology-card"><h4>太陽 ${sunList.join("・")} × 月 ${moonList.join("・")}</h4><p>太陽星座は外に見せやすい性格や人生で大切にする方向性、月星座は心の奥の反応や安心できるものを表すとされます。${sunList[0]}の${zodiacReadings[sunList[0]]} 月星座の${moonList[0]}は、${zodiacReadings[moonList[0]]} 2つの性質をあわせて、自分らしさを見つめてみましょう。</p></div>`;
document.getElementById("numText").innerHTML=`<div class="source-card"><h4>数秘術 ${num}</h4><p>${esc(nums[num])}</p></div>`;
document.getElementById("stemText").innerHTML=`<div class="source-card"><h4>${p.stem[0]}（${p.stem[1]}）</h4><div class="tag">陰陽五行：${p.stem[2]} ｜ 象意：${p.stem[3]}</div><p>${esc(p.stem[4])}</p></div>`;
document.getElementById("branchText").innerHTML=`<div class="source-card"><h4>${p.branch[0]}（${p.branch[1]}）</h4><div class="tag">陰陽五行：${p.branch[2]} ｜ 象意：${p.branch[3]}</div><p>${esc(p.branch[4])}</p></div>`;
}

document.getElementById("imageSave").addEventListener("click",async()=>{
  const hint=document.getElementById("saveHint");
  const report=document.getElementById("report");
  hint.textContent="画像を作成しています…";
  try{
    if(!window.html2canvas){
      await new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        script.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
        script.onload=resolve;
        script.onerror=()=>reject(new Error("画像作成ライブラリを読み込めませんでした"));
        document.head.appendChild(script);
      });
    }
    const canvas=await html2canvas(report,{backgroundColor:"#ffffff",scale:2,useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.clientWidth,report.scrollWidth)});
    const link=document.createElement("a");
    const safeName=(document.getElementById("name").value.trim()||"お客様").replace(/[\\\\/:*?"<>|]/g,"_");
    link.download=`${safeName}_基本性格鑑定書.png`;
    link.href=canvas.toDataURL("image/png");
    link.click();
    hint.textContent="PNG画像を作成しました。スマホでは共有メニューから「画像を保存」を選んでください。";
  }catch(error){
    hint.textContent="画像を保存できませんでした。通信環境を確認して、もう一度お試しください。";
    alert(error.message||"画像の作成に失敗しました。");
  }
});
document.getElementById("copy").addEventListener("click",()=>{let t=document.getElementById("report").innerText;navigator.clipboard?.writeText(t).then(()=>alert("鑑定文をコピーしました。")).catch(()=>alert("コピーできない場合は文章を選択してコピーしてください。"))});make();
